spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/loan_management
    username: loanadmin
    password: loanpass123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTTokenGeneration2024!@#}
  expiration: 86400000
  refresh-expiration: 604800000

file:
  upload-dir: ./uploads

server:
  port: 8080
